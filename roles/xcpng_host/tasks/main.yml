- name: Configure Nagios NRPE
  when: xcpng_install_nagios_nrpe
  ansible.builtin.include_tasks: nagios-nrpe.yml

- name: Configure kernel modules
  ansible.builtin.include_tasks: kernel-modules.yml

- name: Configure Xen command line args
  ansible.builtin.include_tasks: xen-cmdline.yml

- name: Misc other tasks
  ansible.builtin.include_tasks: misc.yml
